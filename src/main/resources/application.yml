spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: "change-this-to-a-long-random-secret-key-at-least-256-bits-for-hs256"
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000

  security:
    admin-username: admin
    admin-password: adminpass
    user-username: user
    user-password: userpass